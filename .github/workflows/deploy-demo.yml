# Bygger appen i demo-modus (syntetiske data, ingen Firebase) og publiserer
# den til GitHub Pages. Kjører på hver push til main.
name: Deploy demo til GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Tving demo-modus: bygget skal aldri koble mot Firebase
          VITE_DEMO_MODE: 'true'
          # Aktiverer base-path /okonomiflyt/ i vite.config.js
          GITHUB_PAGES: 'true'
      # SPA-fallback: GitHub Pages serverer 404.html for ukjente stier, slik
      # at direktelenker som /okonomiflyt/oversikt fortsatt laster appen
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
